<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fern · Test drive</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #1c1c1c; background: #fafaf7; --accent: #3b4bc8; }
      body { margin: 0; }
      header, footer { max-width: 44rem; margin: 0 auto; padding: 1.25rem 1rem; }
      header { display: flex; justify-content: space-between; align-items: center; }
      .mark { font-weight: 700; color: var(--accent); }
      main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem; }
      /* Intentional, for Impeccable's test drive: gradient text on the heading. */
      h1 {
        font-size: clamp(2rem, 6vw, 3.25rem); margin: 0 0 1rem;
        background: linear-gradient(90deg, #ff4d8d, #4d7cff);
        -webkit-background-clip: text; background-clip: text;
        -webkit-text-fill-color: transparent; color: transparent;
      }
      /* Intentional, for Impeccable's test drive: low-contrast text (light grey on near-white). */
      .note { color: #c8c8c8; line-height: 1.5; }
      /* Intentional, for Impeccable's test drive: body text flush with the viewport edge, no background. */
      .edge { margin: 0 calc(50% - 50vw); padding: 0; line-height: 1.5; }
      /* Intentional, for Impeccable's test drive: link text under the 11px floor. */
      .small-link { font-size: 10px; color: var(--accent); }
      /* Intentional, for Impeccable's test drive: transition on a layout property (width). */
      .bar { height: 0.6rem; width: 30%; background: var(--accent); border-radius: 0.3rem; transition: width 0.3s; }
      .bar:hover { width: 100%; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">Fern</span>
      <a class="small-link" href="/">Back to Fern</a>
    </header>
    <main>
      <h1>Fern test drive</h1>
      <p class="note">A throwaway page that shows Impeccable reviewing a change to Fern.</p>
      <p class="edge">Every flaw on this page is planted on purpose, so the review has something to find and report back.</p>
      <div class="bar" role="presentation"></div>
      <p><a class="small-link" href="/#live">See the live list</a></p>
    </main>
    <footer>Fern · a test site for Impeccable reviews</footer>
  </body>
</html>
